<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>잡스크래퍼</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    </head>
    <body>
        <header class="topbar">
            <div class="container">
                <a href="/" class="logo">JOB<span>SCRAPER</span></a>
                <nav>
                    <a href="/">채용정보</a>
                    <a href="/search?keyword=신입">신입공고</a>
                    <a href="/search?keyword=인턴">인턴</a>
                </nav>
            </div>
        </header>

        <section class="hero">
            <div class="container">
                <span class="eyebrow">JOB SEARCH</span>
                <h1>원하는 일자리를<br />한 번에 찾아보세요.</h1>
                <p>키워드 하나로 인크루트의 최신 채용공고를 모아 보여드립니다.</p>

                <form action="/search" class="search-form">
                    <input type="text" name="keyword" placeholder="직무, 회사명, 기술 스택을 입력하세요" autocomplete="off" required />
                    <button>검색하기</button>
                </form>

                <div class="keywords">
                    추천 검색어
                    <a href="/search?keyword=python">Python</a>
                    <a href="/search?keyword=데이터분석">데이터분석</a>
                    <a href="/search?keyword=마케팅">마케팅</a>
                    <a href="/search?keyword=디자이너">디자이너</a>
                </div>
            </div>
        </section>

        <main class="container">
            <div class="features">
                <div class="feature">
                    <span class="num">01</span>
                    <h3>키워드 검색</h3>
                    <p>직무나 회사명을 입력하면 관련 공고를 바로 불러옵니다.</p>
                </div>
                <div class="feature">
                    <span class="num">02</span>
                    <h3>한눈에 비교</h3>
                    <p>회사명, 공고 제목, 근무지를 표로 정리해 보여드립니다.</p>
                </div>
                <div class="feature">
                    <span class="num">03</span>
                    <h3>원문 바로가기</h3>
                    <p>관심 있는 공고는 상세 페이지에서 바로 확인할 수 있습니다.</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">© JobScraper. 채용 정보 출처: 인크루트</div>
        </footer>
    </body>
</html>
